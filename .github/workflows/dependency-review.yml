name: Dependency policy
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        required: true
        type: string
        description: Exact base commit for an issue-generated PR
      head_ref:
        required: true
        type: string
        description: Exact head commit for an issue-generated PR
permissions:
  contents: read
jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate immutable comparison refs
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || inputs.head_ref }}
        run: |
          python3 - <<'PY'
          import os, re
          assert all(re.fullmatch(r'[0-9a-f]{40}', os.environ[name]) for name in ('BASE_REF', 'HEAD_REF'))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          persist-credentials: false
      - name: Enforce approved dependency threshold
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: .github/dependency-review-config.yml
          base-ref: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          head-ref: ${{ github.event.pull_request.head.sha || inputs.head_ref }}
