name: Propose market case from approved ticket
on:
  issues:
    types: [opened, edited, labeled]
permissions: {}
concurrency:
  group: market-case-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  propose:
    if: >-
      vars.SITE_CASE_AUTOMATION == 'enabled' &&
      contains(github.event.issue.labels.*.name, 'agent:ready') &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent:ready')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install pinned policy parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate and propose one case, never execute ticket instructions
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/site_issue_worker.mjs
