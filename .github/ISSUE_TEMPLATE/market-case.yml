name: Suggest a market investigation
description: Describe an event and what you want to understand, in your own words.
title: '[Case] '
labels: ['site:case', 'agent:needs-preparation']
body:
  - type: markdown
    attributes:
      value: |
        Tell us what happened and what you want to understand. A few sentences are enough.
        The agent prepares the research and the map for review. You do not need to design it.
  - type: textarea
    id: event
    attributes:
      label: What event should we investigate?
      placeholder: A major open-source AI model is released, such as DeepSeek, GLM or Qwen.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What would you like to understand?
      placeholder: How could this affect AI companies, chip makers and cloud providers? Could cheaper AI reduce spending, or increase demand enough to offset the savings?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would make the explanation useful? (optional)
      placeholder: Show the competing explanations, who might benefit or lose, what evidence supports each connection, and what could prove it wrong.
  - type: textarea
    id: links
    attributes:
      label: Any useful links or extra context? (optional)
      placeholder: A release announcement, article or model name. Leave this blank if you do not have one.
