name: Test prototype

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependency
        run: python -m pip install -r requirements.txt
      - name: Test gates and runtime controls
        run: python -m unittest discover -v
      - name: Check restricted workflow profile
        run: python -m kit.profile .
      - name: Check installed workflow and YAML configuration
        run: |
          python scripts/install_workflow.py --check
          python -c 'from kit.settings import load; load(".kit/agent-policy.yml")'
      - name: Reproduce pinned gh-aw compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kit-compiler"
          gh release download v0.92.0 --repo github/gh-aw --pattern linux-amd64 --dir "$RUNNER_TEMP/kit-compiler"
          chmod +x "$RUNNER_TEMP/kit-compiler/linux-amd64"
          python scripts/compile.py --compiler "$RUNNER_TEMP/kit-compiler/linux-amd64" --check
      - name: Exercise local control demo
        run: python examples/control_demo.py
      - name: Exercise HTTP gateway and artifact integration
        run: python examples/http_demo.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/diagrams/package-lock.json
      - name: Install pinned diagram tooling
        working-directory: tools/diagrams
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Validate diagram syntax with the renderer
        working-directory: tools/diagrams
        run: npm run check:diagrams
